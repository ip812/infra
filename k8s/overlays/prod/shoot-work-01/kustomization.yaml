---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base
- cloudflared.yaml
# - fluent.yaml
- postgres.yaml
- blog.yaml
# - otel-col.yaml
# - victoria.yaml

# cert-manager comes from base but is not wanted on this cluster
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: cert-manager
    namespace: flux-system
  patch: |
    $patch: delete
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: cert-manager
      namespace: flux-system
