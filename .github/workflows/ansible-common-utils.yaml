---
name: Ansible Common Utils Prod

on:
  push:
    branches:
      - main
    paths:
      - ansible/common-utils.yml
      - ansible/tasks/common.yml

# Core Ansible jobs share the same WireGuard identity (10.0.0.3), so they should
# wait for each other.
concurrency:
  group: ansible-prod
  cancel-in-progress: false

jobs:
  run-playbook:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up WireGuard
        uses: ./.github/actions/wireguard
        with:
          cicd_private_key: ${{ secrets.WG_CICD_PRIVATE_KEY }}
          proxmox_public_key: ${{ secrets.WG_PROXMOX_PUBLIC_KEY }}

      - name: Run Ansible playbook
        uses: dawidd6/action-ansible-playbook@v9
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        with:
          playbook: ansible/common-utils.yml
          key: ${{ secrets.CICD_SSH_PRIVATE_KEY }}
          options: |
            --inventory ansible/inventory.ini
            --user root

      - name: Tear down WireGuard
        if: always()
        uses: ./.github/actions/wireguard-teardown
