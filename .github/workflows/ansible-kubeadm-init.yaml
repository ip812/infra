---
name: Ansible Kubeadm Init

on:
  repository_dispatch:
    types: [kubeadm-init]

env:
  TARGET_VM: ${{ github.event.client_payload.target_vm }}

jobs:
  run-playbook:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # kubeadm jobs use per-cluster WireGuard CI/CD credentials, so to overcome the
      # GitHub limitation that at most one job or workflow run can be pending in the 
      # same concurrency group. Can read more here https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency.
      # Even better, with this approach kubeadm actions can be executed in parallel.
      - name: Resolve WireGuard peer for target VM
        id: wg
        env:
          WG_CICD_WORK_PRIVATE_KEY: ${{ secrets.WG_CI_CD_SHOOT_WORK_01_PRIVATE_KEY }}
          WG_CICD_O11Y_PRIVATE_KEY: ${{ secrets.WG_CI_CD_SHOOT_O11Y_01_PRIVATE_KEY }}
          WG_CICD_MGNT_PRIVATE_KEY: ${{ secrets.WG_CI_CD_SHOOT_MGNT_01_PRIVATE_KEY }}
        run: |
          case "${TARGET_VM}" in
            prod-shoot-work-01-*) addr=10.0.0.11/24; key="${WG_CICD_WORK_PRIVATE_KEY}" ;;
            prod-shoot-o11y-01-*) addr=10.0.0.12/24; key="${WG_CICD_O11Y_PRIVATE_KEY}" ;;
            prod-shoot-mgnt-01-*) addr=10.0.0.13/24; key="${WG_CICD_MGNT_PRIVATE_KEY}" ;;
            *) echo "::error::No WireGuard CI peer mapped for TARGET_VM='${TARGET_VM}'"; exit 1 ;;
          esac
          echo "address=${addr}" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${key}"
          echo "private_key=${key}" >> "$GITHUB_OUTPUT"

      - name: Set up WireGuard
        uses: ./.github/actions/wireguard
        with:
          cicd_private_key: ${{ steps.wg.outputs.private_key }}
          proxmox_public_key: ${{ secrets.WG_PROXMOX_PUBLIC_KEY }}
          address: ${{ steps.wg.outputs.address }}

      - name: Run Ansible playbook
        uses: dawidd6/action-ansible-playbook@v9
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        with:
          playbook: ansible/kubeadm-init.yml
          key: ${{ secrets.CICD_SSH_PRIVATE_KEY }}
          options: |
            --inventory ansible/inventory.ini
            --user root
            --extra-vars target=${{ env.TARGET_VM }}
            --extra-vars dp_token=${{ secrets.DP_TOKEN }}
            --extra-vars gh_access_token=${{ secrets.GH_ACCESS_TOKEN }}
            --extra-vars backups_access_key_id=${{ secrets.BACKUPS_ACCESS_KEY_ID }}
            --extra-vars backups_secret_access_key=${{ secrets.BACKUPS_SECRET_ACCESS_KEY }}
            --extra-vars cf_account_id=${{ secrets.CF_ACCOUNT_ID }}

      - name: Tear down WireGuard
        if: always()
        uses: ./.github/actions/wireguard-teardown
