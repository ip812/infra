---
name: Ansible Dummy

on:
  push:
    branches:
      - main
    paths:
      - ansible/dummy.yml
      - .github/workflows/ansible-dummy.yaml
  workflow_dispatch:

concurrency:
  group: terraform-apply-prod
  cancel-in-progress: false

jobs:
  run-playbook:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up WireGuard
        env:
          WG_CICD_PRIVATE_KEY: ${{ secrets.WG_CICD_PRIVATE_KEY }}
          WG_PROXMOX_PUBLIC_KEY: ${{ secrets.WG_PROXMOX_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf > /dev/null
          [Interface]
          PrivateKey = ${WG_CICD_PRIVATE_KEY}
          Address = 10.0.0.3/24

          [Peer]
          PublicKey = ${WG_PROXMOX_PUBLIC_KEY}
          Endpoint = proxmox.ip812.com:51820
          AllowedIPs = 10.0.0.0/24
          PersistentKeepalive = 25
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Run Ansible playbook
        uses: dawidd6/action-ansible-playbook@v9
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        with:
          playbook: ansible/dummy.yml
          key: ${{ secrets.CICD_SSH_PRIVATE_KEY }}
          options: |
            --inventory ansible/inventory.ini
            --user root

      - name: Tear down WireGuard
        if: always()
        run: sudo wg-quick down wg0
