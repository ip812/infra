# Runs CoreDNS as a Docker container on the Proxmox WireGuard hub, serving the
# wireguard.ip812.com zone. Docker itself is installed via the geerlingguy.docker
# role (see wireguard-hub.yml). The published port is bound to the WireGuard IP
# only, so CoreDNS is not exposed as an open resolver on other interfaces.

- name: Create CoreDNS config directory
  file:
    path: /etc/coredns
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render CoreDNS Corefile
  template:
    src: templates/Corefile.j2
    dest: /etc/coredns/Corefile
    owner: root
    group: root
    mode: "0644"
  notify: Restart CoreDNS

- name: Run CoreDNS container
  community.docker.docker_container:
    name: coredns
    image: coredns/coredns:1.14.6
    command: -conf /etc/coredns/Corefile
    volumes:
      - "/etc/coredns/Corefile:/etc/coredns/Corefile:ro"
    ports:
      - "10.0.0.1:53:53/udp"
      - "10.0.0.1:53:53/tcp"
    restart_policy: unless-stopped
    state: started
